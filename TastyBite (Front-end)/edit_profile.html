<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - TastyBite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="./style.css">
</head>

<body class="All-page-background">

    <nav class="d-flex justify-content-around align-items-center p-2">
        <div>
            <a id="logo-link" href="./index.html"><img style="height: 50px;" src="./Image/background-logo-edited.png" alt=""></a>
        </div>
        <ul class="d-flex gap-4 mb-0 align-items-center">
            <li class="menu"><a href="./food.html">Foods</a></li>
            <li class="menu"><a href="./profile.html">Profile</a></li>
            <li class="menu"><a href="./favorite_foods.html">Favorites</a></li>
            <li class="menu"><a href="./order_history.html">Order History</a></li>
            <li onclick="handlelogOut()" class="menu"><a href="#">Logout</a></li>
            <li class="nav-icon-item">
                <a href="#" class="nav-icon-link" title="Notifications" id="notification-bell-btn">
                    <i class="fa fa-bell"></i>
                    <span class="badge badge-notification" id="nav-notification-count" style="display: none;">0</span>
                </a>
                <div class="notification-dropdown" id="notification-dropdown">
                    <div class="dropdown-header">
                        <span>Notifications</span>
                        <button onclick="clearAllNotifications(event)" class="clear-all-btn">Clear All</button>
                    </div>
                    <div class="dropdown-body" id="notification-items-container">
                        <!-- Loaded dynamically via JS -->
                    </div>
                </div>
            </li>
            <li class="nav-icon-item">
                <a href="./place_order.html" class="nav-icon-link" title="Shopping Cart">
                    <i class="fa fa-shopping-cart"></i>
                    <span class="badge badge-cart" id="nav-cart-count" style="display: none;">0</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="profile-container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="edit-profile-card" style="max-width: 700px; width: 90%; margin: 60px auto; display: block;">
            <h2>Edit Your Profile</h2>
            <form id="edit-profile-form" onsubmit="handleEditProfile(event)">
                <div class="row">
                    <div class="col-md-6 form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" placeholder="First name">
                    </div>
                    <div class="col-md-6 form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" placeholder="Last name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                
                <div class="form-group">
                    <label for="contact_number">Contact Number</label>
                    <input type="text" id="contact_number" placeholder="Contact number" required>
                </div>
                
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <input type="text" id="address" placeholder="Address" required>
                </div>
                
                <div class="form-group">
                    <label for="image_url">Profile Picture URL</label>
                    <input type="url" id="image_url" placeholder="Image URL">
                </div>
                
                <div class="d-flex gap-3 mt-4">
                    <button type="button" onclick="window.location.href='./profile.html'" id="search-button" style="flex: 1; background: linear-gradient(135deg, #718096 0%, #4a5568 100%); border-radius: 12px; box-shadow: none;">Cancel</button>
                    <button type="submit" id="search-button" style="flex: 1.5; border-radius: 12px;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer-all p-5">
        <div class="container w-75 m-auto p-5 row">
            <div class="col-md-6">
                <h3>TastyBite</h3>
                <h5>Follow Us On</h5>
                <div class="icons">
                    <img src="./Image/LinkedIn.png" alt="">
                    <img src="./Image/YouTube.png" alt="">
                </div>
            </div>
            <div class="col-md-6">
                <h5>Company</h5>
                <li>About</li>
                <li>Contact us</li>
                <li>Culture</li>
                <li>Blog</li>
            </div>
        </div>
        <hr>
        <p class="text-center mt-3"><small>Copyright @ TastyBite. All Rights Reserved</small></p>
    </footer>

    <!-- script -->
    <script src="./app.js"></script>
    <script src="./edit_profile.js"></script>
    <script src="./logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
