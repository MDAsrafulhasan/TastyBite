<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/swiffy-slider@1.6.0/dist/css/swiffy-slider.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <link rel="stylesheet" href="./style.css">

</head>

<body class="All-page-background">
    <nav class="d-flex justify-content-around align-items-center p-2">
        <div>
            <a id="logo-link" href="./index.html"><img style="height: 50px;" src="./Image/background-logo-edited.png" alt=""></a>
        </div>
        <ul class="d-flex gap-4 mb-0 align-items-center">
            <li class="menu"><a href="./food.html">Foods</a></li>
            <li class="menu"><a href="./profile.html">Profile</a></li>
            <li class="menu"><a href="./favorite_foods.html">Favorites</a></li>
            <li class="menu"><a href="./order_history.html">Order History</a></li>
            <li onclick="handlelogOut()" class="menu"><a href="#">Logout</a></li>
            <li class="nav-icon-item">
                <a href="#" class="nav-icon-link" title="Notifications" id="notification-bell-btn">
                    <i class="fa fa-bell"></i>
                    <span class="badge badge-notification" id="nav-notification-count" style="display: none;">0</span>
                </a>
                <div class="notification-dropdown" id="notification-dropdown">
                    <div class="dropdown-header">
                        <span>Notifications</span>
                        <button onclick="clearAllNotifications(event)" class="clear-all-btn">Clear All</button>
                    </div>
                    <div class="dropdown-body" id="notification-items-container">
                        <!-- Loaded dynamically via JS -->
                    </div>
                </div>
            </li>
            <li class="nav-icon-item">
                <a href="./place_order.html" class="nav-icon-link" title="Shopping Cart">
                    <i class="fa fa-shopping-cart"></i>
                    <span class="badge badge-cart" id="nav-cart-count" style="display: none;">0</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="profile-container">
        <div class="full-table">
            <br>
            <h3>Order History</h3>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Price</th>
                        <th scope="col">Discount</th>
                        <th scope="col">Discount Price</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Total Price</th>
                    </tr>
                </thead>
                <tbody id="order-history-tbody">
                    <!-- Loaded dynamically via order_history.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- script -->
    <script src="./app.js"></script>
    <script src="./order_history.js"></script>
    <script src="./logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiffy-slider@1.6.0/dist/js/swiffy-slider.min.js" crossorigin="anonymous"
        defer></script>
</body>

</html>
