    <!-- search er kaj -->
    <div class="search-container">
        <div class="center">
            <div>
                <input id="search" type="text" placeholder="search...">
            </div>
            <div>
                <button id="search-button" onclick="handleSearch()">Search</button>
            </div>
        </div>

    </div>

    <!-- Premium Price range & Sorting Toolbar -->
    <div class="filter-toolbar">
        <div class="filter-group">
            <div class="filter-item">
                <label for="price-range">Max Price: <span id="price-val">৳1000</span></label>
                <input type="range" id="price-range" min="0" max="1000" step="10" value="1000" oninput="applyFiltersAndSort()">
            </div>

            <div class="filter-item">
                <label for="category-select">Category:</label>
                <select id="category-select" onchange="applyFiltersAndSort()">
                    <option value="all">All Categories</option>
                </select>
            </div>
            
            <div class="filter-item">
                <label for="sort-by">Sort By:</label>
                <select id="sort-by" onchange="applyFiltersAndSort()">
                    <option value="default">Default</option>
                    <option value="low-to-high">Price: Low to High</option>
                    <option value="high-to-low">Price: High to Low</option>
                    <option value="popular">Popular (Specials First)</option>
                    <option value="discount">Highest Discount</option>
                </select>
            </div>
        </div>
    </div>
